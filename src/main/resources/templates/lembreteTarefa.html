<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lembrete de Tarefa</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">

<table width="100%" cellspacing="0" cellpadding="0">
    <tr>
        <td align="center">
            <table width="500" style="background: white; padding: 30px; border-radius: 10px;">
                <tr>
                    <td align="center">
                        <h2 style="color: #333;">ToDaily</h2><br>
                        <h2 style="color: #333;">Lembrete de Tarefa</h2><br>
                        <p style="font-size: 16px; color: #555;">
                            Olá, <strong>{nome}</strong>! <br><br>
                            A tarefa <strong>{titulo}</strong> (área <strong>{area}</strong>) vence em <strong>{dataFim}</strong> e ainda não foi concluída.
                        </p>

                        <a href="{baseUrl}/areasTrabalho/{areaId}/{area}"
                           style="
                               display: inline-block;
                               background-color: #4CAF50;
                               color: white;
                               padding: 12px 25px;
                               text-decoration: none;
                               border-radius: 6px;
                               font-size: 16px;
                               margin-top: 20px;">
                            Ver Tarefa
                        </a>

                        <p style="font-size: 13px; color: #999; margin-top: 25px;">
                            Você está recebendo este lembrete porque as notificações estão ativadas para esta tarefa.
                        </p>

                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
