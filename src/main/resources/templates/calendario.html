<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Fragment do Modal de Calendário (o botão que o abre fica na sidebar) -->
<div th:fragment="calendario">
    <!-- Modal do Calendário -->
    <div class="overlay-calendario" id="modalCalendario" style="display: none;">
        <div class="modal-calendario" id="calendarioBox">
            <div class="calendario-header">
                <button class="btn-nav-mes" id="btnMesAnterior">
                    <i data-lucide="chevron-left"></i>
                </button>
                <h3 class="calendario-titulo" id="calendarioTitulo">Novembro 2024</h3>
                <button class="btn-nav-mes" id="btnMesProximo">
                    <i data-lucide="chevron-right"></i>
                </button>
            </div>

            <div class="calendario-corpo">
                <div class="calendario-dias-semana">
                    <div class="dia-semana">Dom</div>
                    <div class="dia-semana">Seg</div>
                    <div class="dia-semana">Ter</div>
                    <div class="dia-semana">Qua</div>
                    <div class="dia-semana">Qui</div>
                    <div class="dia-semana">Sex</div>
                    <div class="dia-semana">Sáb</div>
                </div>
                <div class="calendario-grid" id="calendarioGrid">
                    <!-- Os dias serão gerados dinamicamente -->
                </div>
            </div>

            <!-- Visão anual (mini-meses), escondida por padrão -->
            <div class="calendario-ano-grid" id="calendarioAnoGrid">
                <!-- Os 12 mini-meses serão gerados dinamicamente -->
            </div>

            <div class="calendario-tarefas-dia" id="calendarioTarefasDia" style="display: none;">
                <h4 class="calendario-tarefas-titulo" id="calendarioTarefasTitulo"></h4>
                <div class="calendario-tarefas-lista" id="calendarioTarefasLista">
                    <!-- Tarefas do dia selecionado serão renderizadas aqui -->
                </div>
            </div>

            <div class="calendario-footer">
                <button class="btn-ver-ano" id="btnVerAno">Ver ano</button>
                <button class="btn-hoje" id="btnHoje">Hoje</button>
                <button class="btn-fechar-calendario" id="btnFecharCalendario">Fechar</button>
            </div>
        </div>
    </div>
</div>

<!-- Script do Calendário -->
<div th:fragment="calendario-script">
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const btnCalendario = document.getElementById('btnCalendario');
            const modalCalendario = document.getElementById('modalCalendario');
            const calendarioBox = document.getElementById('calendarioBox');
            const btnFecharCalendario = document.getElementById('btnFecharCalendario');
            const calendarioCorpo = document.querySelector('.calendario-corpo');
            const calendarioGrid = document.getElementById('calendarioGrid');
            const calendarioAnoGrid = document.getElementById('calendarioAnoGrid');
            const calendarioTitulo = document.getElementById('calendarioTitulo');
            const btnMesAnterior = document.getElementById('btnMesAnterior');
            const btnMesProximo = document.getElementById('btnMesProximo');
            const btnHoje = document.getElementById('btnHoje');
            const btnVerAno = document.getElementById('btnVerAno');
            const calendarioTarefasDia = document.getElementById('calendarioTarefasDia');
            const calendarioTarefasTitulo = document.getElementById('calendarioTarefasTitulo');
            const calendarioTarefasLista = document.getElementById('calendarioTarefasLista');

            let dataAtual = new Date();
            let mesAtual = dataAtual.getMonth();
            let anoAtual = dataAtual.getFullYear();
            let diaSelecionado = null;
            let tarefasCalendario = [];
            let modoAno = false;

            const meses = [
                'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
                'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
            ];
            const mesesAbrev = [
                'Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun',
                'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'
            ];
            const diasSemanaAbrev = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];

            // Busca as tarefas da área atual (ou de todas as áreas do usuário) para
            // marcar os dias com atividade e listar as tarefas do dia selecionado.
            // Busca tudo de uma vez (não só do mês exibido) pra não precisar refazer a
            // requisição ao navegar entre meses/anos dentro do modal já aberto.
            async function carregarTarefasCalendario() {
                let resposta;
                if (window.areaAtualId) {
                    resposta = await fetch(`/areasTrabalho/${window.areaAtualId}/tarefas`);
                } else {
                    resposta = await fetch(`/user/tarefas`);
                }
                tarefasCalendario = resposta.ok ? await resposta.json() : [];
            }

            function dataISO(ano, mes, dia) {
                return `${ano}-${String(mes + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
            }

            function sairDoModoAno() {
                modoAno = false;
                calendarioBox.classList.remove('modo-ano');
                calendarioAnoGrid.style.display = 'none';
                calendarioCorpo.style.display = 'block';
                btnVerAno.textContent = 'Ver ano';
            }

            // Abrir modal do calendário
            btnCalendario.addEventListener('click', async function() {
                modalCalendario.style.display = 'flex';
                calendarioTarefasDia.style.display = 'none';
                diaSelecionado = null;
                sairDoModoAno();
                await carregarTarefasCalendario();
                renderizarCalendario();
                lucide.createIcons();
            });

            // Fechar modal
            btnFecharCalendario.addEventListener('click', function() {
                modalCalendario.style.display = 'none';
            });

            // Fechar ao clicar no overlay
            modalCalendario.addEventListener('click', function(e) {
                if (e.target === modalCalendario) {
                    modalCalendario.style.display = 'none';
                }
            });

            // Navegar para mês (ou ano, se estiver na visão anual) anterior
            btnMesAnterior.addEventListener('click', function() {
                if (modoAno) {
                    anoAtual--;
                    renderizarAno();
                    return;
                }
                mesAtual--;
                if (mesAtual < 0) {
                    mesAtual = 11;
                    anoAtual--;
                }
                diaSelecionado = null;
                calendarioTarefasDia.style.display = 'none';
                renderizarCalendario();
                lucide.createIcons();
            });

            // Navegar para próximo mês (ou ano, se estiver na visão anual)
            btnMesProximo.addEventListener('click', function() {
                if (modoAno) {
                    anoAtual++;
                    renderizarAno();
                    return;
                }
                mesAtual++;
                if (mesAtual > 11) {
                    mesAtual = 0;
                    anoAtual++;
                }
                diaSelecionado = null;
                calendarioTarefasDia.style.display = 'none';
                renderizarCalendario();
                lucide.createIcons();
            });

            // Voltar para hoje (sempre volta pra visão mês)
            btnHoje.addEventListener('click', function() {
                const hoje = new Date();
                mesAtual = hoje.getMonth();
                anoAtual = hoje.getFullYear();
                diaSelecionado = null;
                calendarioTarefasDia.style.display = 'none';
                sairDoModoAno();
                renderizarCalendario();
                lucide.createIcons();
            });

            // Alternar entre a visão mês e a visão ano (overview anual, tipo Google Calendar)
            btnVerAno.addEventListener('click', function() {
                modoAno = !modoAno;
                calendarioTarefasDia.style.display = 'none';

                if (modoAno) {
                    calendarioBox.classList.add('modo-ano');
                    calendarioCorpo.style.display = 'none';
                    calendarioAnoGrid.style.display = 'grid';
                    btnVerAno.textContent = 'Ver mês';
                    renderizarAno();
                } else {
                    sairDoModoAno();
                    renderizarCalendario();
                    lucide.createIcons();
                }
            });

            // Função para renderizar o calendário
            function renderizarCalendario() {
                calendarioGrid.innerHTML = '';
                calendarioTitulo.textContent = `${meses[mesAtual]} ${anoAtual}`;

                const primeiroDia = new Date(anoAtual, mesAtual, 1).getDay();
                const diasNoMes = new Date(anoAtual, mesAtual + 1, 0).getDate();
                const hoje = new Date();
                const diaHoje = hoje.getDate();
                const mesHoje = hoje.getMonth();
                const anoHoje = hoje.getFullYear();

                // Adicionar células vazias antes do primeiro dia
                for (let i = 0; i < primeiroDia; i++) {
                    const celula = document.createElement('div');
                    celula.className = 'calendario-dia vazio';
                    calendarioGrid.appendChild(celula);
                }

                // Adicionar os dias do mês
                for (let dia = 1; dia <= diasNoMes; dia++) {
                    const celula = document.createElement('div');
                    celula.className = 'calendario-dia';
                    celula.textContent = dia;

                    const iso = dataISO(anoAtual, mesAtual, dia);

                    // Destacar o dia de hoje
                    if (dia === diaHoje && mesAtual === mesHoje && anoAtual === anoHoje) {
                        celula.classList.add('hoje');
                    }

                    // Marcar dias que têm alguma tarefa com prazo nessa data
                    if (tarefasCalendario.some(t => t.dataFim === iso)) {
                        celula.classList.add('tem-tarefa');
                    }

                    if (dia === diaSelecionado) {
                        celula.classList.add('selecionado');
                    }

                    // Adicionar evento de clique
                    celula.addEventListener('click', function() {
                        // Remover seleção anterior
                        document.querySelectorAll('.calendario-dia').forEach(d => {
                            d.classList.remove('selecionado');
                        });

                        // Adicionar seleção
                        celula.classList.add('selecionado');
                        diaSelecionado = dia;

                        mostrarTarefasDoDia(iso, dia);
                    });

                    calendarioGrid.appendChild(celula);
                }
            }

            // Constrói um mini-mês (usado na visão anual)
            function construirMiniMes(ano, mes) {
                const container = document.createElement('div');
                container.className = 'mini-mes';

                const titulo = document.createElement('div');
                titulo.className = 'mini-mes-titulo';
                titulo.textContent = mesesAbrev[mes];
                titulo.title = 'Ver ' + meses[mes] + ' de ' + ano;
                titulo.addEventListener('click', function() {
                    mesAtual = mes;
                    anoAtual = ano;
                    diaSelecionado = null;
                    sairDoModoAno();
                    renderizarCalendario();
                    lucide.createIcons();
                });
                container.appendChild(titulo);

                const diasSemanaEl = document.createElement('div');
                diasSemanaEl.className = 'mini-mes-dias-semana';
                diasSemanaAbrev.forEach(letra => {
                    const span = document.createElement('span');
                    span.textContent = letra;
                    diasSemanaEl.appendChild(span);
                });
                container.appendChild(diasSemanaEl);

                const grid = document.createElement('div');
                grid.className = 'mini-mes-grid';

                const primeiroDia = new Date(ano, mes, 1).getDay();
                const diasNoMes = new Date(ano, mes + 1, 0).getDate();
                const hoje = new Date();

                for (let i = 0; i < primeiroDia; i++) {
                    grid.appendChild(document.createElement('span'));
                }

                for (let dia = 1; dia <= diasNoMes; dia++) {
                    const iso = dataISO(ano, mes, dia);
                    const celula = document.createElement('span');
                    celula.className = 'mini-mes-dia';
                    celula.textContent = dia;

                    if (dia === hoje.getDate() && mes === hoje.getMonth() && ano === hoje.getFullYear()) {
                        celula.classList.add('hoje');
                    }
                    if (tarefasCalendario.some(t => t.dataFim === iso)) {
                        celula.classList.add('tem-tarefa');
                    }

                    grid.appendChild(celula);
                }

                container.appendChild(grid);
                return container;
            }

            // Renderiza a visão anual: 12 mini-meses do ano atual
            function renderizarAno() {
                calendarioTitulo.textContent = `${anoAtual}`;
                calendarioAnoGrid.innerHTML = '';
                for (let mes = 0; mes < 12; mes++) {
                    calendarioAnoGrid.appendChild(construirMiniMes(anoAtual, mes));
                }
            }

            // Mostra, abaixo do grid, as tarefas cujo prazo é a data selecionada
            function mostrarTarefasDoDia(iso, dia) {
                const tarefasDoDia = tarefasCalendario.filter(t => t.dataFim === iso);

                calendarioTarefasTitulo.textContent = `Tarefas em ${String(dia).padStart(2, '0')}/${String(mesAtual + 1).padStart(2, '0')}/${anoAtual}`;
                calendarioTarefasLista.innerHTML = '';

                if (tarefasDoDia.length === 0) {
                    calendarioTarefasLista.innerHTML = '<p class="calendario-tarefas-vazia">Nenhuma tarefa nesse dia.</p>';
                } else {
                    tarefasDoDia.forEach(tarefa => {
                        const item = document.createElement('div');
                        item.className = 'calendario-tarefa-item';

                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.checked = !!tarefa.concluida;
                        checkbox.addEventListener('change', function() {
                            alternarConclusaoTarefaCalendario(tarefa, checkbox.checked);
                        });

                        const nome = document.createElement('span');
                        nome.className = 'calendario-tarefa-nome' + (tarefa.concluida ? ' concluida' : '');
                        nome.textContent = tarefa.titulo;

                        item.appendChild(checkbox);
                        item.appendChild(nome);

                        if (tarefa.areaNome && tarefa.listaNome) {
                            const origem = document.createElement('span');
                            origem.className = 'calendario-tarefa-origem';
                            origem.textContent = `${tarefa.areaNome} › ${tarefa.listaNome}`;
                            item.appendChild(origem);
                        }

                        calendarioTarefasLista.appendChild(item);
                    });
                }

                calendarioTarefasDia.style.display = 'block';
            }

            // Marca/desmarca a tarefa como concluída direto pela lista do calendário
            async function alternarConclusaoTarefaCalendario(tarefa, concluida) {
                const resposta = await fetch(`/tarefas/${tarefa.id}/toggle`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        titulo: tarefa.titulo,
                        listaId: tarefa.listaId,
                        concluida,
                        responsavelId: tarefa.responsavel
                    })
                });

                if (!resposta.ok) {
                    alert('Erro ao atualizar a tarefa.');
                    return;
                }

                tarefa.concluida = concluida;
                renderizarCalendario();
                mostrarTarefasDoDia(tarefa.dataFim, diaSelecionado);
                lucide.createIcons();
            }

            // Renderizar calendário inicial
            renderizarCalendario();
        });
    </script>
</div>

</body>
</html>
