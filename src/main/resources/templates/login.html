<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDaily - Login</title>
    <link rel="stylesheet" href="/css/login.css" />
    <link rel="stylesheet" href="/css/avisos.css" />
</head>
<body>
<div class="logo">
    <img src="/img/logo.png" alt="ToDaily logo" />

</div>

<div class="login-container">
    <h2>ToDaily</h2>
    <p class="aviso sucesso" th:if="${mensagem != null}" th:text="${mensagem}"></p>
    <p class="aviso erro" th:if="${erro != null}" th:text="${erro}"></p>
    <p class="aviso alerta" th:if="${remocao != null}" th:text="${remocao}"></p>
    <p class="aviso erro" id="avisoLogin" hidden></p>
    <form th:if="${emailNaoVerificado != null}" action="/reenviarVerificacao" method="post" style="text-align:center; margin-bottom: 15px;">
        <input type="hidden" name="email" th:value="${emailNaoVerificado}" />
        <button type="submit" class="btn secundario">Reenviar e-mail de confirmação</button>
    </form>
    <form id="loginForm" action="/login" method="post" novalidate>
        <label for="login">Login:</label>
        <input type="text" id="login" name="email" th:classappend="${credenciaisInvalidas != null} ? 'campo-invalido'" required />

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" th:classappend="${credenciaisInvalidas != null} ? 'campo-invalido'" required />
        <p class="forgot-password-link" style="text-align: right;">
            <a href="/recuperarSenhaEmail">
                Esqueci a Senha
            </a>
        </p>
        <button type="submit" class="btn">Entrar</button>
        <button type="button" class="btn secundario" onclick="window.location.href='/cadastro'">Cadastrar-se</button>


    </form>
</div>
<script src="/js/validacao.js"></script>
<script>
    const form = document.getElementById("loginForm");
    const aviso = document.getElementById("avisoLogin");
    Validacao.limparAoDigitar(form, aviso);

    form.addEventListener("submit", function (e) {
        const login = document.getElementById("login");
        const senha = document.getElementById("senha");
        const faltando = [];
        if (!login.value.trim()) { Validacao.marcar(login, true); faltando.push("o e-mail"); }
        if (!senha.value) { Validacao.marcar(senha, true); faltando.push("a senha"); }
        if (faltando.length) {
            e.preventDefault();
            Validacao.mostrarAviso(aviso, "Informe " + faltando.join(" e ") + " para entrar.");
            (login.classList.contains("campo-invalido") ? login : senha).focus();
        }
    });
</script>
</body>
</html>
