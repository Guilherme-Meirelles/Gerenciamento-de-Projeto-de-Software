<!DOCTYPE html>
<html lang="pt-br" th:lang="${#locale.toLanguageTag()}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="#{login.titulo}">ToDaily - Login</title>
    <link rel="stylesheet" href="/css/login.css" />
    <link rel="stylesheet" href="/css/avisos.css" />
    <link rel="stylesheet" href="/css/idioma.css" />
    <link rel="stylesheet" href="/css/acessibilidade-temas.css" />
    <link rel="stylesheet" href="/css/acessibilidade.css" />
    <script src="/idioma/mensagens.js"></script>
    <script src="/js/acessibilidade.js"></script>
</head>
<body>
<div th:replace="~{idiomaSeletor :: seletor}"></div>
<div class="logo">
    <img src="/img/logo.png" alt="ToDaily logo" th:alt="#{comum.logoAlt}" />

</div>

<div class="login-container">
    <h2>ToDaily</h2>
    <p class="aviso sucesso" th:if="${mensagem != null}" th:text="${mensagem}"></p>
    <p class="aviso erro" th:if="${erro != null}" th:text="${erro}"></p>
    <p class="aviso alerta" th:if="${remocao != null}" th:text="${remocao}"></p>
    <p class="aviso erro" id="avisoLogin" hidden></p>
    <form th:if="${emailNaoVerificado != null}" action="/reenviarVerificacao" method="post" style="text-align:center; margin-bottom: 15px;">
        <input type="hidden" name="email" th:value="${emailNaoVerificado}" />
        <button type="submit" class="btn secundario" th:text="#{login.reenviar}">Reenviar e-mail de confirmação</button>
    </form>
    <form id="loginForm" action="/login" method="post" novalidate>
        <label for="login" th:text="#{login.campo}">Login</label>
        <input type="text" id="login" name="email" th:classappend="${credenciaisInvalidas != null} ? 'campo-invalido'" required />

        <label for="senha" th:text="#{comum.senha}">Senha</label>
        <input type="password" id="senha" name="senha" th:classappend="${credenciaisInvalidas != null} ? 'campo-invalido'" required />
        <p class="forgot-password-link" style="text-align: right;">
            <a href="/recuperarSenhaEmail" th:text="#{login.esqueci}">Esqueci a Senha</a>
        </p>
        <button type="submit" class="btn" th:text="#{login.entrar}">Entrar</button>
        <button type="button" class="btn secundario" onclick="window.location.href='/cadastro'" th:text="#{login.cadastrar}">Cadastrar-se</button>


    </form>
</div>
<script src="/js/validacao.js"></script>
<script>
    const form = document.getElementById("loginForm");
    const aviso = document.getElementById("avisoLogin");
    Validacao.limparAoDigitar(form, aviso);

    form.addEventListener("submit", function (e) {
        const login = document.getElementById("login");
        const senha = document.getElementById("senha");
        const semLogin = !login.value.trim();
        const semSenha = !senha.value;
        if (semLogin) Validacao.marcar(login, true);
        if (semSenha) Validacao.marcar(senha, true);
        if (semLogin || semSenha) {
            e.preventDefault();
            Validacao.mostrarAviso(aviso, t(semLogin && semSenha ? "js.login.emailSenha" : semLogin ? "js.login.email" : "js.login.senha"));
            (login.classList.contains("campo-invalido") ? login : senha).focus();
        }
    });
</script>
</body>
</html>
