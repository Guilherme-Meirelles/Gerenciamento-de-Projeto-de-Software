<!DOCTYPE html>
<html lang="pt-br" th:lang="${#locale.toLanguageTag()}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{recuperar.titulo}">ToDaily - Recuperação de Senha</title>
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/avisos.css">
    <link rel="stylesheet" href="/css/idioma.css" />
    <link rel="stylesheet" href="/css/acessibilidade-temas.css" />
    <link rel="stylesheet" href="/css/acessibilidade.css" />
    <script src="/idioma/mensagens.js"></script>
    <script src="/js/acessibilidade.js"></script>
</head>
<body>
<div th:replace="~{idiomaSeletor :: seletor}"></div>
<div class="logo">
    <img src="/img/logo.png" alt="ToDaily logo" th:alt="#{comum.logoAlt}" />
</div>

<div class="login-container">
    <h4 th:text="#{recuperar.cabecalho}">Insira o seu e-mail para recuperar sua senha</h4>
    <p class="aviso sucesso" th:if="${mensagem != null}" th:text="${mensagem}"></p>
    <p class="aviso erro" th:if="${erro != null}" th:text="${erro}"></p>
    <p class="aviso erro" id="avisoEmail" hidden></p>
    <form id="emailForm" method="post" action="/recuperar-senha" novalidate>


        <label for="email" th:text="#{comum.email}">E-mail</label>
        <input type="email" id="email" name="email" placeholder="email@exemplo.com" th:placeholder="#{recuperar.phEmail}" th:classappend="${erro != null} ? 'campo-invalido'" required>
        <button type="submit" class="btn" th:text="#{recuperar.botao}">CONFIRMAR</button>
        <button type="button" class="btn secundario" onclick="window.location.href='/login'" th:text="#{comum.voltar}">Voltar</button>
    </form>
</div>

<script src="/js/validacao.js"></script>
<script>
    const form = document.getElementById("emailForm");
    const aviso = document.getElementById("avisoEmail");
    Validacao.limparAoDigitar(form, aviso);

    form.addEventListener("submit", function (e) {
        const email = document.getElementById("email");
        const valor = email.value.trim();
        if (!valor) {
            e.preventDefault();
            Validacao.marcar(email, true);
            Validacao.mostrarAviso(aviso, t("js.recuperar.informeEmail"));
            email.focus();
        } else if (!Validacao.emailValido(valor)) {
            e.preventDefault();
            Validacao.marcar(email, true);
            Validacao.mostrarAviso(aviso, t("js.form.emailInvalido"));
            email.focus();
        }
    });
</script>
</body>
</html>
