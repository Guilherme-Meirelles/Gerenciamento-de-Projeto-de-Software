<!DOCTYPE html>
<html lang="{lang}">
<head>
    <meta charset="UTF-8">
    <title>{{email.verif.tituloPagina}}</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">

<table width="100%" cellspacing="0" cellpadding="0">
    <tr>
        <td align="center">
            <table width="500" style="background: white; padding: 30px; border-radius: 10px;">
                <tr>
                    <td align="center">
                        <h2 style="color: #333;">{{email.verif.titulo}}</h2>

                        <p style="font-size: 16px; color: #555;">
                            {{email.ola}}, <strong>{nome}</strong>! <br><br>
                            {{email.verif.corpo}}
                        </p>

                        <a href="{baseUrl}/verificarEmail?token={token}"
                           style="
                               display: inline-block;
                               background-color: #4CAF50;
                               color: white;
                               padding: 12px 25px;
                               text-decoration: none;
                               border-radius: 6px;
                               font-size: 16px;
                               margin-top: 20px;">
                            {{email.verif.botao}}
                        </a>

                        <p style="font-size: 13px; color: #999; margin-top: 25px;">
                            {{email.verif.expira}} <br>
                            {{email.verif.ignorar}}
                        </p>

                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
