<!DOCTYPE html>
<html lang="pt-br" th:lang="${#locale.toLanguageTag()}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="#{redefinir.titulo}">ToDaily - Redefinição de Senha</title>
    <link rel="stylesheet" href="/css/login.css" />
    <link rel="stylesheet" href="/css/avisos.css" />
    <link rel="stylesheet" href="/css/idioma.css" />
    <link rel="stylesheet" href="/css/acessibilidade-temas.css" />
    <link rel="stylesheet" href="/css/acessibilidade.css" />
    <script src="/idioma/mensagens.js"></script>
    <script src="/js/acessibilidade.js"></script>
</head>
<body>
<div th:replace="~{idiomaSeletor :: seletor}"></div>
<div class="logo">
    <img src="/img/logo.png" alt="ToDaily logo" th:alt="#{comum.logoAlt}" />

</div>

<div class="login-container">
    <h4 th:text="#{redefinir.cabecalho}">Redefinição de Senha</h4>

    <p class="aviso erro" th:if="${erro != null}" th:text="${erro}"></p>
    <p class="aviso erro" id="avisoRedefinicao" hidden></p>

    <form id="redefinicaoForm" action="/redefinirSenha" method="post" novalidate onsubmit="return validarSenha()">

        <input type="hidden" name="token" th:value="${token}">
        <label for="senha" th:text="#{comum.senha}">Senha</label>
        <input type="password" id="senha" name="senha" maxlength="72" required />

        <label for="confirmarSenha" th:text="#{comum.confirmarSenha}">Confirmar Senha</label>
        <input type="password" id="confirmarSenha" name="confirmarSenha" maxlength="72" required />

        <button type="submit" class="btn" th:text="#{comum.confirmar}">Confirmar</button>

    </form>
</div>
<script src="/js/validacao.js"></script>
<script>
    const avisoRedefinicao = document.getElementById("avisoRedefinicao");
    Validacao.limparAoDigitar(document.getElementById("redefinicaoForm"), avisoRedefinicao);

    function validarSenha() {
        const senha = document.getElementById("senha");
        const confirmar = document.getElementById("confirmarSenha");
        [senha, confirmar].forEach(c => Validacao.marcar(c, false));

        let mensagem = "";
        let primeiro = null;
        if (!senha.value.trim() || !confirmar.value.trim()) {
            [senha, confirmar].filter(c => !c.value.trim()).forEach(c => Validacao.marcar(c, true));
            primeiro = !senha.value.trim() ? senha : confirmar;
            mensagem = t("js.form.preenchaCampos");
        } else if (Validacao.requisitosFaltando(senha.value).length) {
            Validacao.marcar(senha, true);
            primeiro = senha;
            mensagem = t("js.form.senhaPrecisa", Validacao.juntar(Validacao.requisitosFaltando(senha.value)));
        } else if (senha.value !== confirmar.value) {
            Validacao.marcar(confirmar, true);
            primeiro = confirmar;
            mensagem = t("js.form.senhasDiferentes");
        }

        if (primeiro) {
            Validacao.mostrarAviso(avisoRedefinicao, mensagem);
            primeiro.focus();
            return false;
        }
        return true;
    }
</script>
</body>
</html>
