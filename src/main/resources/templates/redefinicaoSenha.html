<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDaily - Redefinição de Senha</title>
    <link rel="stylesheet" href="/css/login.css" />
    <link rel="stylesheet" href="/css/avisos.css" />
</head>
<body>
<div class="logo">
    <img src="/img/logo.png" alt="ToDaily logo" />

</div>

<div class="login-container">
    <h4>Redefinição de Senha</h4>

    <p class="aviso erro" th:if="${erro != null}" th:text="${erro}"></p>
    <p class="aviso erro" id="avisoRedefinicao" hidden></p>

    <form id="redefinicaoForm" action="/redefinirSenha" method="post" novalidate onsubmit="return validarSenha()">

        <input type="hidden" name="token" th:value="${token}">
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required />

        <label for="confirmarSenha">Confirmar Senha:</label>
        <input type="password" id="confirmarSenha" name="confirmarSenha" required />

        <button type="submit" class="btn">Confirmar</button>

    </form>
</div>
<script src="/js/validacao.js"></script>
<script>
    const avisoRedefinicao = document.getElementById("avisoRedefinicao");
    Validacao.limparAoDigitar(document.getElementById("redefinicaoForm"), avisoRedefinicao);

    function validarSenha() {
        const senha = document.getElementById("senha");
        const confirmar = document.getElementById("confirmarSenha");
        [senha, confirmar].forEach(c => Validacao.marcar(c, false));

        let mensagem = "";
        let primeiro = null;
        if (!senha.value.trim() || !confirmar.value.trim()) {
            [senha, confirmar].filter(c => !c.value.trim()).forEach(c => Validacao.marcar(c, true));
            primeiro = !senha.value.trim() ? senha : confirmar;
            mensagem = "Preencha os campos destacados.";
        } else if (senha.value.length < 8) {
            Validacao.marcar(senha, true);
            primeiro = senha;
            mensagem = "A senha deve ter pelo menos 8 caracteres.";
        } else if (senha.value !== confirmar.value) {
            Validacao.marcar(confirmar, true);
            primeiro = confirmar;
            mensagem = "As senhas não coincidem.";
        }

        if (primeiro) {
            Validacao.mostrarAviso(avisoRedefinicao, mensagem);
            primeiro.focus();
            return false;
        }
        return true;
    }
</script>
</body>
</html>
