spring.application.name=ToDaily
app.base-url=http://localhost:8080

spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=servicoemaildev@gmail.com
spring.mail.password=${MAIL_PASSWORD}
mail.from.name=ToDaily
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Horário do job de lembretes por e-mail (cron). Padrão: todo dia às 08:00. Para testar, defina TODAILY_LEMBRETES_CRON (ex.: "0 * * * * *" = todo minuto).
todaily.lembretes.cron=${TODAILY_LEMBRETES_CRON:0 0 8 * * *}
